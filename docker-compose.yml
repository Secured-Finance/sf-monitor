---
# Metrics server (port 8081) is disabled by default (METRICS_ENABLED unset, see
# .env.example) and not exposed here. To enable it, set METRICS_ENABLED=true in .env
# and add a `ports: ["8081:8081"]` mapping below.

services:
  monitor:
    build: .
    image: sf-monitor:local
    env_file: .env
    environment:
      LOG_LEVEL: ${RUST_LOG:-info}
      IN_DOCKER: 'true'
    restart: on-failure:5
    mem_swappiness: 0
    security_opt:
      - no-new-privileges
    volumes:
      - ./config:/app/config/:ro
      - ${MONITOR_DATA_DIR:?MONITOR_DATA_DIR must be set in .env - a /dev/null fallback would silently drop last-processed-block persistence}:/app/data
      - ${LOG_DATA_DIR:-./logs}:/app/logs
