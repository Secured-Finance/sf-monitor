name: Build and Test

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Check Syntax with Prettier
        run: npm run prettier:check

      - name: Check Style with ESLint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      # Adapter and alert-formatting unit tests (stdlib unittest, no network, no
      # install step - web3/requests are imported lazily by the code under test). The
      # adapter tests were not executed by this workflow before, so a green build did
      # not mean the adapter's fail-closed behaviour had been checked.
      - name: Test adapters and alert formatting
        run: npm test

      - name: Generate monitors (smoke test)
        run: |
          SF_ENV=development npm run pregenerate
          SF_ENV=development npm run generate
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          ETHEREUM_SEPOLIA_RPC_URL: ${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }}
          ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
          FILECOIN_MAINNET_RPC_URL: ${{ secrets.FILECOIN_MAINNET_RPC_URL }}
          FILECOIN_CALIBRATION_RPC_URL: ${{ secrets.FILECOIN_CALIBRATION_RPC_URL }}
