name: Deploy sf-monitor to GKE

# Manual dispatch only - development/staging exist for testing and are never deployed
# to GCP automatically; production deploys are also deliberate, not triggered by a push,
# since a misconfigured monitor means missed alerts on real protocol risk (see
# CLAUDE.md's working principles). Run this workflow manually and pick the environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  DEPLOYMENT_NAME: sf-monitor
  IMAGE: sf-monitor
  REGISTRY: ${{ vars.GCP_REGISTRY }}
  REPOSITORY: ${{ vars.GCP_REPOSITORY }}
  NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
  # Needed at build time (not just runtime) now - block-unit-price/itayose resolve
  # their watched addresses via a live RPC call inside `npm run generate`, which runs
  # during `docker build` (see Dockerfile). Same secrets already used below for the
  # runtime Kubernetes Secret.
  ETHEREUM_MAINNET_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_RPC_URL }}
  ETHEREUM_SEPOLIA_RPC_URL: ${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }}
  ARBITRUM_ONE_RPC_URL: ${{ secrets.ARBITRUM_ONE_RPC_URL }}
  ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}
  # Filecoin's real upstream endpoints, used by the generator at build time and by the
  # adapter sidecar at runtime. These fall back to the public GLIF endpoints when no
  # secret is set, which is shared infrastructure with no SLA or rate-limit guarantee -
  # the "Report Filecoin endpoint source" step below makes that visible in the run log
  # rather than letting a forgotten secret pass unnoticed.
  FILECOIN_MAINNET_RPC_URL: ${{ secrets.FILECOIN_MAINNET_RPC_URL || 'https://api.node.glif.io/rpc/v1' }}
  FILECOIN_CALIBRATION_RPC_URL: ${{ secrets.FILECOIN_CALIBRATION_RPC_URL || 'https://api.calibration.node.glif.io/rpc/v1' }}

jobs:
  identify-env:
    name: Identify the environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Resolve environment
        run: echo "Deploying environment ${{ github.event.inputs.environment }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [identify-env]
    environment: ${{ needs.identify-env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker
        run: |
          gcloud --quiet auth configure-docker ${{ env.REGISTRY }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }} --project ${{ env.PROJECT_ID }}

      - name: Report Filecoin endpoint source
        run: |
          if [ -n "${{ secrets.FILECOIN_MAINNET_RPC_URL }}" ]; then
            echo "Filecoin mainnet: using FILECOIN_MAINNET_RPC_URL secret"
          else
            echo "::warning::Filecoin mainnet: no FILECOIN_MAINNET_RPC_URL secret set - falling back to the public GLIF endpoint (shared, rate-limited, no SLA)"
          fi
          if [ -n "${{ secrets.FILECOIN_CALIBRATION_RPC_URL }}" ]; then
            echo "Filecoin calibration: using FILECOIN_CALIBRATION_RPC_URL secret"
          else
            echo "::warning::Filecoin calibration: no FILECOIN_CALIBRATION_RPC_URL secret set - falling back to the public GLIF endpoint (shared, rate-limited, no SLA)"
          fi

      - name: Build
        run: |
          docker build \
            --secret id=npm_auth_token,env=NPM_AUTH_TOKEN \
            --secret id=ethereum_mainnet_rpc_url,env=ETHEREUM_MAINNET_RPC_URL \
            --secret id=ethereum_sepolia_rpc_url,env=ETHEREUM_SEPOLIA_RPC_URL \
            --secret id=arbitrum_one_rpc_url,env=ARBITRUM_ONE_RPC_URL \
            --secret id=arbitrum_sepolia_rpc_url,env=ARBITRUM_SEPOLIA_RPC_URL \
            --secret id=filecoin_mainnet_rpc_url,env=FILECOIN_MAINNET_RPC_URL \
            --secret id=filecoin_calibration_rpc_url,env=FILECOIN_CALIBRATION_RPC_URL \
            --build-arg SF_ENV=${{ needs.identify-env.outputs.environment }} \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:${{ github.sha }}" \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:latest" \
            .

      - name: Publish
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:latest"

      - name: Create Kubernetes secrets
        run: |
          kubectl delete secret sf-monitor-secrets-${{ needs.identify-env.outputs.environment }} --ignore-not-found

          kubectl create secret generic sf-monitor-secrets-${{ needs.identify-env.outputs.environment }} \
            --from-literal="SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" \
            --from-literal="ETHEREUM_MAINNET_RPC_URL=${{ secrets.ETHEREUM_MAINNET_RPC_URL }}" \
            --from-literal="ETHEREUM_SEPOLIA_RPC_URL=${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }}" \
            --from-literal="ARBITRUM_ONE_RPC_URL=${{ secrets.ARBITRUM_ONE_RPC_URL }}" \
            --from-literal="ARBITRUM_SEPOLIA_RPC_URL=${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}" \
            --from-literal="FILECOIN_UPSTREAM_RPC_URL=${{ needs.identify-env.outputs.environment == 'production' && env.FILECOIN_MAINNET_RPC_URL || env.FILECOIN_CALIBRATION_RPC_URL }}"

      - name: Deploy
        run: |
          cat <<EOF > deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
            labels:
              app: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
            template:
              metadata:
                labels:
                  app: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
              spec:
                containers:
                - name: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
                  image: "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:${{ github.sha }}"
                  # OZ Monitor creates its per-network watchers once at boot and only
                  # logs if a client cannot be built (src/main.rs), with nothing to
                  # retry afterwards. Both containers start together, so without this
                  # gate a slow adapter leaves Filecoin with no watcher at all while
                  # the Pod stays Running and healthy. The wait exits non-zero if the
                  # adapter never answers, so the Pod crash-loops visibly instead.
                  command:
                    - /bin/sh
                    - -c
                    - python3 /app/adapters/wait_for_adapter.py && exec /app/openzeppelin-monitor
                  resources:
                    requests:
                      cpu: "100m"
                      memory: "256Mi"
                    limits:
                      cpu: "1000m"
                      memory: "512Mi"
                  env:
                    - name: SF_ENV
                      value: "${{ needs.identify-env.outputs.environment }}"
                    - name: LOG_LEVEL
                      value: "info"
                    - name: IN_DOCKER
                      value: "true"
                    # config/networks/filecoin_*.json points OZ Monitor (and the Python
                    # trigger scripts) at the adapter sidecar below, not at Filecoin
                    # directly. Same Pod, so plain loopback.
                    - name: FILECOIN_ADAPTER_URL
                      value: "http://127.0.0.1:8547"
                  envFrom:
                    - secretRef:
                        name: sf-monitor-secrets-${{ needs.identify-env.outputs.environment }}
                  volumeMounts:
                    - name: data
                      mountPath: /app/data
                # Filecoin null-round bridge (adapters/filecoin_adapter.py). Runs in
                # every environment, not just production, so development/staging on
                # Calibration exercise the identical code path before it reaches
                # mainnet. Same image as the monitor - it only changes the command.
                #
                # Liveness deliberately hits /live, which is cheap and does not touch
                # upstream: it restarts a wedged HTTP loop (the real failure mode for a
                # threaded Python server) without turning a GLIF outage into a restart
                # storm. /ready does probe upstream, but is observability only -
                # readiness never gates loopback traffic inside a Pod.
                - name: filecoin-rpc-adapter
                  image: "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:${{ github.sha }}"
                  command: ["python3", "/app/adapters/filecoin_adapter.py"]
                  env:
                    - name: FILECOIN_EXPECTED_CHAIN_ID
                      value: "${{ needs.identify-env.outputs.environment == 'production' && '314' || '314159' }}"
                    # Must exceed the network's real finality lag or the staleness guard
                    # rejects every watermark read and halts monitoring: measured ~12 min
                    # on mainnet but ~98 min on Calibration.
                    - name: FILECOIN_MAX_FINALIZED_AGE_SECONDS
                      value: "${{ needs.identify-env.outputs.environment == 'production' && '1800' || '10800' }}"
                    - name: FILECOIN_UPSTREAM_RPC_URL
                      valueFrom:
                        secretKeyRef:
                          name: sf-monitor-secrets-${{ needs.identify-env.outputs.environment }}
                          key: FILECOIN_UPSTREAM_RPC_URL
                  # exec, not httpGet: the adapter binds 127.0.0.1 so it is reachable
                  # only from inside this Pod, while httpGet probes come from the
                  # kubelet via the Pod IP and would always fail. exec runs in the
                  # container, so the loopback-only bind stays as it is.
                  #
                  # The startupProbe covers the adapter's bounded upstream retry at boot
                  # (up to ~60s), so liveness cannot kill it before it ever binds.
                  # timeoutSeconds is set explicitly on all three: it defaults to 1s,
                  # which is shorter than the probes' own HTTP timeouts (and than the
                  # python3 start-up cost), so the defaults would fail spuriously.
                  startupProbe:
                    exec:
                      command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8547/live', timeout=5)"]
                    periodSeconds: 5
                    timeoutSeconds: 8
                    failureThreshold: 24
                  livenessProbe:
                    exec:
                      command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8547/live', timeout=5)"]
                    periodSeconds: 30
                    timeoutSeconds: 8
                    failureThreshold: 3
                  readinessProbe:
                    exec:
                      command: ["python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8547/ready', timeout=10)"]
                    periodSeconds: 30
                    timeoutSeconds: 15
                  resources:
                    requests:
                      cpu: "25m"
                      memory: "32Mi"
                    limits:
                      cpu: "250m"
                      memory: "128Mi"
                volumes:
                  - name: data
                    emptyDir: {}
                restartPolicy: Always
          EOF

          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
