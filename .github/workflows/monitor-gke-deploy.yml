name: Deploy sf-monitor to GKE

# Manual dispatch only - development/staging exist for testing and are never deployed
# to GCP automatically; production deploys are also deliberate, not triggered by a push,
# since a misconfigured monitor means missed alerts on real protocol risk (see
# CLAUDE.md's working principles). Run this workflow manually and pick the environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  DEPLOYMENT_NAME: sf-monitor
  IMAGE: sf-monitor
  REGISTRY: ${{ vars.GCP_REGISTRY }}
  REPOSITORY: ${{ vars.GCP_REPOSITORY }}
  NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
  # Needed at build time (not just runtime) now - block-unit-price/itayose resolve
  # their watched addresses via a live RPC call inside `npm run generate`, which runs
  # during `docker build` (see Dockerfile). Same secrets already used below for the
  # runtime Kubernetes Secret.
  ETHEREUM_MAINNET_RPC_URL: ${{ secrets.ETHEREUM_MAINNET_RPC_URL }}
  ETHEREUM_SEPOLIA_RPC_URL: ${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }}
  ARBITRUM_ONE_RPC_URL: ${{ secrets.ARBITRUM_ONE_RPC_URL }}
  ARBITRUM_SEPOLIA_RPC_URL: ${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}

jobs:
  identify-env:
    name: Identify the environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Resolve environment
        run: echo "Deploying environment ${{ github.event.inputs.environment }}"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [identify-env]
    environment: ${{ needs.identify-env.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure Docker
        run: |
          gcloud --quiet auth configure-docker ${{ env.REGISTRY }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }} --project ${{ env.PROJECT_ID }}

      - name: Build
        run: |
          docker build \
            --secret id=npm_auth_token,env=NPM_AUTH_TOKEN \
            --secret id=ethereum_mainnet_rpc_url,env=ETHEREUM_MAINNET_RPC_URL \
            --secret id=ethereum_sepolia_rpc_url,env=ETHEREUM_SEPOLIA_RPC_URL \
            --secret id=arbitrum_one_rpc_url,env=ARBITRUM_ONE_RPC_URL \
            --secret id=arbitrum_sepolia_rpc_url,env=ARBITRUM_SEPOLIA_RPC_URL \
            --build-arg SF_ENV=${{ needs.identify-env.outputs.environment }} \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:${{ github.sha }}" \
            --tag "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:latest" \
            .

      - name: Publish
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:latest"

      - name: Create Kubernetes secrets
        run: |
          kubectl delete secret sf-monitor-secrets-${{ needs.identify-env.outputs.environment }} --ignore-not-found

          # Severity routing (invariant-monitoring-spec.md §04). The declarative Slack
          # triggers read these env vars directly and have no fallback of their own, so
          # both are always set - defaulting to the single webhook when a dedicated
          # channel hasn't been created yet, which keeps the split adoptable without a
          # config change.
          kubectl create secret generic sf-monitor-secrets-${{ needs.identify-env.outputs.environment }} \
            --from-literal="SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" \
            --from-literal="SLACK_WEBHOOK_URL_CRITICAL=${{ secrets.SLACK_WEBHOOK_URL_CRITICAL || secrets.SLACK_WEBHOOK_URL }}" \
            --from-literal="SLACK_WEBHOOK_URL_INFO=${{ secrets.SLACK_WEBHOOK_URL_INFO || secrets.SLACK_WEBHOOK_URL }}" \
            --from-literal="ETHEREUM_MAINNET_RPC_URL=${{ secrets.ETHEREUM_MAINNET_RPC_URL }}" \
            --from-literal="ETHEREUM_SEPOLIA_RPC_URL=${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }}" \
            --from-literal="ARBITRUM_ONE_RPC_URL=${{ secrets.ARBITRUM_ONE_RPC_URL }}" \
            --from-literal="ARBITRUM_SEPOLIA_RPC_URL=${{ secrets.ARBITRUM_SEPOLIA_RPC_URL }}"

      - name: Deploy
        run: |
          cat <<EOF > deployment.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
            labels:
              app: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
            template:
              metadata:
                labels:
                  app: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
              spec:
                containers:
                - name: ${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}
                  image: "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:${{ github.sha }}"
                  resources:
                    requests:
                      cpu: "100m"
                      memory: "256Mi"
                    limits:
                      cpu: "1000m"
                      memory: "512Mi"
                  env:
                    - name: SF_ENV
                      value: "${{ needs.identify-env.outputs.environment }}"
                    - name: LOG_LEVEL
                      value: "info"
                    - name: IN_DOCKER
                      value: "true"
                  envFrom:
                    - secretRef:
                        name: sf-monitor-secrets-${{ needs.identify-env.outputs.environment }}
                  volumeMounts:
                    - name: data
                      mountPath: /app/data
                volumes:
                  - name: data
                    emptyDir: {}
                restartPolicy: Always
          EOF

          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}-${{ needs.identify-env.outputs.environment }}

      # The periodic invariant sweep (config/triggers/scripts/sweep.py). OZ Monitor is
      # event-driven, but some invariants have no triggering event - and the sweep is
      # also the backstop for anything the event path misses (a cursor gap, a restart, a
      # dropped block, a monitor orphaned by a contract upgrade). Same image, same
      # secrets, same generated config as the Deployment above.
      - name: Deploy invariant sweep CronJob
        run: |
          cat <<EOF > sweep-cronjob.yaml
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: ${{ env.DEPLOYMENT_NAME }}-sweep-${{ needs.identify-env.outputs.environment }}
            labels:
              app: ${{ env.DEPLOYMENT_NAME }}-sweep-${{ needs.identify-env.outputs.environment }}
          spec:
            schedule: "*/15 * * * *"
            # A sweep that overlaps itself gains nothing and doubles RPC load.
            concurrencyPolicy: Forbid
            startingDeadlineSeconds: 300
            successfulJobsHistoryLimit: 3
            failedJobsHistoryLimit: 5
            jobTemplate:
              spec:
                # The sweep exits non-zero on an invariant breach, which is a real
                # finding rather than a transient error - retrying it would just repeat
                # the same alert.
                backoffLimit: 0
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                    - name: sweep
                      image: "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}-${{ needs.identify-env.outputs.environment }}:${{ github.sha }}"
                      workingDir: /app
                      command: ["python3", "config/triggers/scripts/sweep.py"]
                      resources:
                        requests:
                          cpu: "50m"
                          memory: "128Mi"
                        limits:
                          cpu: "500m"
                          memory: "256Mi"
                      env:
                        - name: SF_ENV
                          value: "${{ needs.identify-env.outputs.environment }}"
                      envFrom:
                        - secretRef:
                            name: sf-monitor-secrets-${{ needs.identify-env.outputs.environment }}
          EOF

          kubectl apply -f sweep-cronjob.yaml
